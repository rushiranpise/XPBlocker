name: Build APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build XPBlocker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execution permission
        run: chmod +x ./gradlew

      - name: Prepare release signing (optional)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # app/build.gradle resolves storeFile relative to the app module.
          echo "$KEYSTORE_BASE64" | base64 -d > app/xpblocker.keystore

      - name: Build APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Extract version
        id: version
        run: |
          echo "VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/XPBlocker-${{ steps.version.outputs.VERSION }}-debug.apk"
          # If Gradle did not sign the release (no secrets), sign it with uber-apk-signer.
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/XPBlocker-${{ steps.version.outputs.VERSION }}-release.apk"
          else
            mkdir -p /tmp/xpb
            wget -nv "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -O /tmp/xpb/uber-apk-signer.jar
            java -jar /tmp/xpb/uber-apk-signer.jar --apks ./app/build/outputs/apk/release/app-release-unsigned.apk --out /tmp/xpb/
            mv /tmp/xpb/app-release-aligned-debugSigned.apk "dist/XPBlocker-${{ steps.version.outputs.VERSION }}-release.apk"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xpblocker-build
          path: dist/*.apk

      - name: Publish GitHub Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
