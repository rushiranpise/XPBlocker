plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aviraxp.xpblocker.next'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aviraxp.xpblocker.next'
        minSdk 26
        targetSdk 35

        versionCode 34
        versionName '1.8.34'

        multiDexEnabled true
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    androidResources {
        namespaced false
        additionalParameters.add('--no-version-vectors')
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_11
        sourceCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
        release {
            keyAlias System.getenv("KEY_ALIAS") ?: 'xpblocker'
            keyPassword System.getenv("KEYSTORE_PASS")
            storeFile file(System.getenv("KEYSTORE_FILE") ?: 'xpblocker.keystore')
            storePassword System.getenv("KEY_PASS")
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            jniDebuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources false
            jniDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            /* Sign with the real release key when the signing secrets are present
               (set in CI); otherwise produce an unsigned APK that CI signs with
               uber-apk-signer. */
            if (System.getenv("KEYSTORE_PASS") != null && System.getenv("KEY_PASS") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    '**/**.version', '**/**.properties', '**/LGPL2.1',
                    '**/DEPENDENCIES', '**/DEPENDENCIES.txt', '**/dependencies.txt',
                    '**/LICENSE', '**/LICENSE.txt', '**/license.txt',
                    '**/NOTICE', '**/NOTICE.txt', '**/notice.txt'
            ]
        }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {
    // Xposed API (API 82). Vendored as a jar because the old jcenter / aliyun
    // mirrors that hosted it are dead; compileOnly only - the API classes must
    // NEVER be bundled into the module APK or they would shadow the framework's own.
    compileOnly files('libs/api-82.jar')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
}